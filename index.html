
<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PERSEDIAAN RST</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    overflow-x:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#eef3f0;
    color:#1f2b24;
    font-size:13px;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:12px;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:relative;

    background:
        linear-gradient(
            135deg,
            #075b32 0%,
            #0d7540 55%,
            #198754 100%
        );

    color:white;

    border-radius:16px;

    padding:18px 18px;

    margin-bottom:11px;

    display:flex;
    align-items:center;

    gap:14px;

    box-shadow:
        0 8px 20px rgba(7,91,50,.22);

    overflow:hidden;
}

.header::after{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    right:-55px;
    top:-70px;

    border-radius:50%;

    background:rgba(255,255,255,.08);
}

.header-logo{
    width:62px;
    height:62px;

    object-fit:contain;

    background:white;

    border-radius:12px;

    padding:4px;

    flex-shrink:0;

    box-shadow:
        0 3px 8px rgba(0,0,0,.15);

    position:relative;
    z-index:1;
}

.header-text{
    display:flex;
    flex-direction:column;

    min-width:0;

    position:relative;
    z-index:1;
}

.header h1{
    margin:0;

    font-size:24px;

    line-height:1.15;

    color:white;

    font-weight:900;

    letter-spacing:.4px;
}

.header p{
    margin:6px 0 0;

    font-size:11px;

    color:#dff3e7;

    line-height:1.35;
}

/* =====================================================
   STATUS
===================================================== */

.status{
    background:#ffffff;

    border:1px solid #d6e2db;

    border-left:5px solid #198754;

    border-radius:10px;

    padding:10px 12px;

    margin-bottom:11px;

    font-size:11px;

    color:#59675f;

    box-shadow:
        0 3px 9px rgba(0,0,0,.05);
}

/* =====================================================
   RINGKASAN
===================================================== */

.summary{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:12px;
}

.card{
    background:white;

    border:1px solid #d7e2db;

    border-radius:13px;

    padding:13px 14px;

    min-height:76px;

    box-shadow:
        0 4px 12px rgba(25,70,45,.07);

    position:relative;

    overflow:hidden;
}

.card::before{
    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:4px;

    background:#198754;
}

.card-label{
    font-size:10px;

    color:#718078;

    margin-bottom:6px;

    font-weight:800;

    letter-spacing:.5px;

    text-transform:uppercase;
}

.card-value{
    font-size:22px;

    font-weight:900;

    color:#176b3a;

    line-height:1.1;
}

/* =====================================================
   TABEL WRAPPER
===================================================== */

.table-wrap{
    width:100%;

    overflow-x:auto;

    background:white;

    border:1px solid #d4e0d9;

    border-radius:14px;

    -webkit-overflow-scrolling:touch;

    box-shadow:
        0 5px 16px rgba(25,70,45,.08);
}

/* =====================================================
   TABLE
===================================================== */

table{
    width:100%;

    min-width:620px;

    border-collapse:separate;

    border-spacing:0;

    table-layout:auto;
}

th,
td{
    border-bottom:1px solid #e7ede9;

    padding:9px 7px;

    text-align:left;

    vertical-align:middle;

    white-space:nowrap;
}

/* =====================================================
   HEADER TABEL
===================================================== */

thead tr:first-child th{
    background:#176b3a;

    color:white;

    font-size:12px;

    font-weight:900;

    text-align:center;

    padding:10px 7px;

    border-bottom:0;

    position:sticky;

    top:0;

    z-index:6;

    letter-spacing:.2px;
}

thead tr:first-child th:first-child{
    border-top-left-radius:10px;
}

thead tr:first-child th:last-child{
    border-top-right-radius:10px;
}

/* =====================================================
   FILTER ROW
===================================================== */

thead tr.filter-row th{
    background:#f0f5f2;

    padding:6px;

    position:sticky;

    top:38px;

    z-index:5;

    border-bottom:1px solid #d5e0da;
}

thead tr.filter-row select,
thead tr.filter-row textarea{
    font-size:13px !important;

    font-family:Arial,sans-serif !important;
}

/* =====================================================
   BODY
===================================================== */

tbody tr:nth-child(even){
    background:#fafcfb;
}

tbody tr:hover{
    background:#eaf6ef;
}

tbody td{
    font-size:14px;

    text-align:center !important;

    color:#27332c;

    font-weight:600;

    padding-top:9px;
    padding-bottom:9px;
}

tbody tr:last-child td{
    border-bottom:none;
}

/* =====================================================
   KOLOM
===================================================== */

.col-tahun{
    width:65px;

    text-align:center !important;
}

.col-sortimen{
    width:100px;

    text-align:center !important;
}

.col-mutu{
    width:60px;

    text-align:center !important;
}

.col-ukuran{
    width:50px;

    text-align:center !important;
}

.col-batang{
    width:90px;

    text-align:center !important;
}

.col-volume{
    width:100px;

    text-align:center !important;
}

/* =====================================================
   FILTER
===================================================== */

select,
input{
    width:100%;

    height:32px;

    border:1px solid #c8d5cd;

    border-radius:7px;

    background:white;

    padding:4px 7px;

    font-family:Arial,sans-serif;

    font-size:11px;

    color:#26332b;

    outline:none;

    transition:
        border-color .15s ease,
        box-shadow .15s ease,
        background .15s ease;
}

select:hover,
input:hover{
    border-color:#9db5a6;
}

select:focus,
input:focus{
    border-color:#198754;

    background:#fbfefc;

    box-shadow:
        0 0 0 3px rgba(25,135,84,.10);
}

/* =====================================================
   FILTER UKURAN
===================================================== */

#filterUkuran{
    width:100%;

    min-height:32px;

    height:32px;

    resize:none;

    overflow:hidden;

    border:1px solid #c8d5cd;

    border-radius:7px;

    background:white;

    padding:4px 7px;

    font-family:Arial,sans-serif;

    font-size:11px;

    line-height:22px;

    color:#26332b;

    outline:none;

    display:block;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;
}

#filterUkuran:hover{
    border-color:#9db5a6;
}

#filterUkuran:focus{
    border-color:#198754;

    box-shadow:
        0 0 0 3px rgba(25,135,84,.10);
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    text-align:center;

    padding:28px 10px;

    color:#68776f;

    font-size:11px;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;

    padding:30px 10px;

    color:#8a968f;

    font-size:11px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{
        font-size:12px;
    }

    .container{
        padding:7px;

        max-width:100%;
    }

    /* HEADER */

    .header{
        padding:13px 13px;

        border-radius:12px;

        gap:11px;

        margin-bottom:8px;
    }

    .header-logo{
        width:50px;
        height:50px;

        border-radius:9px;
    }

    .header h1{
        font-size:19px;
    }

    .header p{
        font-size:10px;

        margin-top:4px;
    }

    /* STATUS */

    .status{
        padding:8px 9px;

        margin-bottom:8px;

        font-size:10px;

        border-radius:8px;
    }

    /* SUMMARY */

    .summary{
        gap:7px;

        margin-bottom:9px;
    }

    .card{
        padding:11px 10px;

        min-height:68px;

        border-radius:10px;
    }

    .card-label{
        font-size:9px;

        margin-bottom:5px;
    }

    .card-value{
        font-size:19px;
    }

    /* TABLE */

    .table-wrap{
        border-radius:10px;
    }

    table{
        min-width:570px;
    }

    th,
    td{
        padding:7px 5px;
    }

    thead tr:first-child th{
        font-size:10px;

        padding:8px 5px;
    }

    thead tr.filter-row th{
        padding:5px;

        top:34px;
    }

    tbody td{
        font-size:14px;

        padding-top:8px;
        padding-bottom:8px;
    }

    /* FILTER */

    select,
    input{
        height:29px;

        font-size:10px;

        padding:3px 5px;
    }

    #filterUkuran{
        min-height:29px;

        height:29px;

        font-size:10px;

        line-height:20px;

        padding:3px 5px;
    }

    /* COLUMNS */

    .col-tahun{
        width:50px;
    }

    .col-sortimen{
        width:100px;
    }

    .col-mutu{
        width:50px;
    }

    .col-ukuran{
        width:145px;
    }

    .col-batang{
        width:75px;
    }

    .col-volume{
        width:90px;
    }
}

/* =====================================================
   VERY SMALL HP
===================================================== */

@media(max-width:380px){

    .container{
        padding:5px;
    }

    .header{
        padding:11px;
    }

    .header-logo{
        width:46px;
        height:46px;
    }

    .header h1{
        font-size:17px;
    }

    .header p{
        font-size:9px;
    }

    .card{
        padding:10px 9px;
    }

    .card-value{
        font-size:18px;
    }

    table{
        min-width:535px;
    }

    .col-tahun{
        width:45px;
    }

    .col-sortimen{
        width:90px;
    }

    .col-mutu{
        width:45px;
    }

    .col-ukuran{
        width:135px;
    }

    .col-batang{
        width:65px;
    }

    .col-volume{
        width:80px;
    }
}
</style>

</head>

<body>

<div class="container">

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby9dcBegLV7frA3KRFNW3cvM7dwbeBI91smsnFmX8KijjpuTk15KRo4XDsAvNYAFpU2/exec";


/* =====================================================
   ELEMENT
===================================================== */

const statusBox =
    document.getElementById("status");

const tbody =
    document.getElementById("tbody");

const summary =
    document.getElementById("summary");

const totalBatang =
    document.getElementById("totalBatang");

const totalVolume =
    document.getElementById("totalVolume");

const filterTahun =
    document.getElementById("filterTahun");

const filterSortimen =
    document.getElementById("filterSortimen");

const filterMutu =
    document.getElementById("filterMutu");

const filterUkuran =
    document.getElementById("filterUkuran");


/* =====================================================
   DATA
===================================================== */

let timerUkuran = null;

let dataTerakhir = [];

let nomorRequest = 0;

/* =====================================================
   AUTO RESIZE UKURAN
===================================================== */

filterUkuran.addEventListener(
    "input",
    function(){

        this.style.height =
            "27px";

        this.style.height =
            this.scrollHeight + "px";

    }
);


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatBatang(value){

    return Number(value || 0)
        .toLocaleString("id-ID");

}


function formatVolume(value){

    return Number(value || 0)
        .toLocaleString(
            "id-ID",
            {
                minimumFractionDigits:6,
                maximumFractionDigits:6
            }
        );

}


/* =====================================================
   JSONP
===================================================== */

function jsonp(url){

    return fetch(
        url +
        (url.includes("?") ? "&" : "?") +
        "_=" +
        Date.now(),
        {
            method: "GET",
            cache: "no-store"
        }
    )
    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        return response.json();

    })
    .catch(function(error){

        console.error(
            "FETCH ERROR =",
            error
        );

        throw new Error(
            "Gagal mengambil data dari Apps Script."
        );

    });

}
/* =====================================================
   AMBIL FILTER
===================================================== */

async function loadFilters(){

    try{

        const url =
            API_URL +
            "?action=filter";


        const hasil =
            await jsonp(url);


        if(!hasil || !hasil.sukses){

            throw new Error(
                hasil && hasil.error
                    ? hasil.error
                    : "Filter gagal."
            );

        }


        /* SORTIMEN */

        filterSortimen.innerHTML =
            '<option value="SEMUA">SEMUA</option>';


        (hasil.sortimen || [])
            .forEach(function(item){

                const option =
                    document.createElement("option");

                option.value = item;
                option.textContent = item;

                filterSortimen.appendChild(option);

            });


  /* MUTU */

filterMutu.innerHTML =
    '<option value="SEMUA">SEMUA</option>';


const urutanMutu = [
    "P",
    "D",
    "T"
];


(hasil.mutu || [])
    .sort(function(a,b){

        const posisiA =
            urutanMutu.indexOf(
                String(a).toUpperCase()
            );

        const posisiB =
            urutanMutu.indexOf(
                String(b).toUpperCase()
            );

        const nilaiA =
            posisiA === -1
                ? 999
                : posisiA;

        const nilaiB =
            posisiB === -1
                ? 999
                : posisiB;

        return nilaiA - nilaiB;

    })
    .forEach(function(item){

        const option =
            document.createElement("option");

        option.value = item;
        option.textContent = item;

        filterMutu.appendChild(option);

    });
    }

    catch(error){

        console.error(error);

        statusBox.textContent =
            "FILTER GAGAL: " +
            error.message;

    }

}


/* =====================================================
   NORMALISASI PENCARIAN UKURAN
===================================================== */

function normalisasiUkuran(text){

    return String(text || "")
        .toUpperCase()
        .split(/\r?\n/)
        .map(function(baris){

            return baris
                .replace(/×/g," ")
                .replace(/X/g," ")
                .replace(/,/g," ")
                .replace(/;/g," ")
                .replace(/\s+/g," ")
                .trim();

        })
        .filter(function(baris){

            return baris !== "";

        })
        .join("|");

}

/* =====================================================
   AMBIL DATA
===================================================== */

async function loadData(){

    const requestIni =
        ++nomorRequest;

    try{

        statusBox.textContent =
            "MEMUAT DATA...";


        tbody.innerHTML =
            '<tr>' +
            '<td colspan="6" class="loading">' +
            'MEMUAT DATA...' +
            '</td>' +
            '</tr>';


        const tahun =
            encodeURIComponent(
                filterTahun.value
            );


        const sortimen =
            encodeURIComponent(
                filterSortimen.value
            );


        const mutu =
            encodeURIComponent(
                filterMutu.value
            );


        /*
         * UKURAN dikirim sebagai satu pencarian.
         * Contoh:
         * 18 100 550
         */

        const ukuran =
            encodeURIComponent(
                normalisasiUkuran(
                    filterUkuran.value
                )
            );


        const url =
            API_URL +
            "?action=data" +
            "&tahun=" + tahun +
            "&sortimen=" + sortimen +
            "&mutu=" + mutu +
            "&ukuran=" + ukuran;


        const hasil =
            await jsonp(url);

        console.log("HASIL DATA RST =", hasil);
        
        if(requestIni !== nomorRequest){

    return;

}


        if(!hasil || !hasil.sukses){

            throw new Error(
                hasil && hasil.error
                    ? hasil.error
                    : "Data gagal diambil."
            );

        }


        tampilkanData(
            hasil.data || []
        );


        statusBox.textContent =
    "UPDATE S/D " +
    (
        hasil.tanggalUpdate ||
        "-"
    );

    }

    catch(error){

        console.error(error);

        tbody.innerHTML =
            '<tr>' +
            '<td colspan="6" class="empty">' +
            'GAGAL MENGAMBIL DATA<br>' +
            error.message +
            '</td>' +
            '</tr>';


        totalBatang.textContent =
            "0";


        totalVolume.textContent =
            "0,000000";


        summary.style.display =
            "none";


        statusBox.textContent =
            "ERROR: " +
            error.message;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(data){

    console.time("RENDER DATA 845");

    dataTerakhir = data;

    tbody.innerHTML = "";

    let jumlahBatang = 0;
    let jumlahVolume = 0;

    if(!data.length){

        tbody.innerHTML =
            '<tr>' +
            '<td colspan="6" class="empty">' +
            'DATA TIDAK DITEMUKAN' +
            '</td>' +
            '</tr>';

        totalBatang.textContent = "0";
        totalVolume.textContent = "0,000000";
        summary.style.display = "none";

        console.timeEnd("RENDER DATA 845");
        return;
    }

    if(data.length > 1){
        summary.style.display = "grid";
    }else{
        summary.style.display = "none";
    }

    const urutanSortimen = [
        "DECKING",
        "FLOORING",
        "LONGSTRIP",
        "PB PANJANG",
        "PB PENDEK",
        "P STOCK",
        "FJL",
        "RENG",
        "LIST",
        "HOUSING COMPONENT"
    ];

    const urutanMutu = [
        "P",
        "D",
        "T"
    ];

    data.sort(function(a,b){

        const posisiSortimenA =
            urutanSortimen.indexOf(
                String(a.sortimen || "").toUpperCase()
            );

        const posisiSortimenB =
            urutanSortimen.indexOf(
                String(b.sortimen || "").toUpperCase()
            );

        const nilaiSortimenA =
            posisiSortimenA === -1 ? 999 : posisiSortimenA;

        const nilaiSortimenB =
            posisiSortimenB === -1 ? 999 : posisiSortimenB;

        if(nilaiSortimenA !== nilaiSortimenB){
            return nilaiSortimenA - nilaiSortimenB;
        }

        const posisiMutuA =
            urutanMutu.indexOf(
                String(a.mutu || "").toUpperCase()
            );

        const posisiMutuB =
            urutanMutu.indexOf(
                String(b.mutu || "").toUpperCase()
            );

        const nilaiMutuA =
            posisiMutuA === -1 ? 999 : posisiMutuA;

        const nilaiMutuB =
            posisiMutuB === -1 ? 999 : posisiMutuB;

        return nilaiMutuA - nilaiMutuB;

    });

    const fragment =
        document.createDocumentFragment();

    data.forEach(function(item){

        jumlahBatang +=
            Number(item.batang || 0);

        jumlahVolume +=
            Number(item.volume || 0);

        const tr =
            document.createElement("tr");

        tr.innerHTML =
            "<td style='text-align:center;'>" +
            escapeHTML(item.tahun) +
            "</td>" +

            "<td>" +
            escapeHTML(item.sortimen) +
            "</td>" +

            "<td style='text-align:center;'>" +
            escapeHTML(item.mutu) +
            "</td>" +

            "<td>" +
            escapeHTML(item.ukuran) +
            "</td>" +

            "<td style='text-align:right;'>" +
            formatBatang(item.batang) +
            "</td>" +

            "<td style='text-align:right;'>" +
            formatVolume(item.volume) +
            "</td>";

        fragment.appendChild(tr);

    });

    tbody.appendChild(fragment);

    totalBatang.textContent =
        formatBatang(jumlahBatang);

    totalVolume.textContent =
        formatVolume(jumlahVolume);

    console.timeEnd("RENDER DATA 845");
}
    
/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =====================================================
   DOWNLOAD EXCEL
===================================================== */

function muatLibraryExcel(){

    return new Promise(function(resolve,reject){

        if(window.XLSX){

            resolve();

            return;

        }


        const script =
            document.createElement("script");


        script.src =
            "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";


        script.onload =
            function(){

                resolve();

            };


        script.onerror =
            function(){

                reject(
                    new Error(
                        "GAGAL MEMUAT FITUR EXCEL."
                    )
                );

            };


        document.head.appendChild(script);

    });

}


document
    .getElementById("btnDownloadExcel")
    .addEventListener(
        "click",
        async function(){

            if(!dataTerakhir.length){

                alert(
                    "TIDAK ADA DATA UNTUK DI-DOWNLOAD."
                );

                return;

            }


            try{

                this.disabled = true;

                this.textContent =
                    "MENYIAPKAN EXCEL...";


                await muatLibraryExcel();


                const dataExcel =
                    dataTerakhir.map(function(item){

                        return {

                            "TAHUN":
                                item.tahun,

                            "SORTIMEN":
                                item.sortimen,

                            "MUTU":
                                item.mutu,

                            "UKURAN":
                                item.ukuran,

                            "BATANG":
                                item.batang,

                            "VOLUME":
                                item.volume

                        };

                    });


                const worksheet =
                    XLSX.utils.json_to_sheet(
                        dataExcel
                    );


                const workbook =
                    XLSX.utils.book_new();


                XLSX.utils.book_append_sheet(
                    workbook,
                    worksheet,
                    "PERSEDIAAN RST"
                );


                worksheet["!cols"] = [

                    { wch:10 },
                    { wch:24 },
                    { wch:10 },
                    { wch:24 },
                    { wch:14 },
                    { wch:16 }

                ];


                XLSX.writeFile(
                    workbook,
                    "PERSEDIAAN_RST.xlsx"
                );

            }
            catch(error){

                console.error(error);

                alert(
                    error.message
                );

            }
            finally{

                this.disabled = false;

                this.textContent =
                    "DOWNLOAD EXCEL";

            }

        }
    );

function cekUpdateDiBelakang(){

    fetch(
        API_URL +
        "?action=cekupdate" +
        "&_=" +
        Date.now()
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        return response.json();

    })

    .then(function(hasil){

        console.log(
            "CEK UPDATE RST =",
            hasil
        );

        if(!hasil || !hasil.sukses){

            console.warn(
                "CEK UPDATE GAGAL"
            );

            return;

        }

        if(
            hasil.status ===
            "CACHE_DIPERBARUI"
        ){

            console.log(
                "CACHE RST BERHASIL DIPERBARUI"
            );

            /*
             * Data yang sedang tampil masih data lama.
             * Ambil ulang data setelah cache selesai dibangun.
             */
            loadData();

        }

    })

    .catch(function(error){

        console.warn(
            "CEK UPDATE ERROR =",
            error
        );

    });

}
