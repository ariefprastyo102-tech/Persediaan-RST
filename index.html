
<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PERSEDIAAN RST</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    overflow-x:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
    font-size:13px;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:10px;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:linear-gradient(
        135deg,
        #0f6b3a,
        #198754
    );
    color:white;
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 3px 8px rgba(23,107,58,.18);
}

.header-logo{
    width:54px;
    height:54px;
    object-fit:contain;
    background:white;
    border-radius:8px;
    padding:3px;
    flex-shrink:0;
}

.header-text{
    display:flex;
    flex-direction:column;
}

.header h1{
    margin:0;
    font-size:21px;
    line-height:1.2;
    color:white;
    font-weight:800;
    letter-spacing:.3px;
}

.header p{
    margin:4px 0 0;
    font-size:11px;
    color:#e8f5ed;
}
/* =====================================================
   STATUS
===================================================== */

.status{
    background:white;
    border:1px solid #ddd;
    border-radius:7px;
    padding:7px 9px;
    margin-bottom:8px;
    font-size:11px;
    color:#555;
}

/* =====================================================
   RINGKASAN
===================================================== */

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:9px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:7px;
    padding:8px 10px;
}

.card-label{
    font-size:10px;
    color:#777;
    margin-bottom:2px;
}

.card-value{
    font-size:17px;
    font-weight:bold;
}

/* =====================================================
   TABEL
===================================================== */

.table-wrap{
    width:100%;
    overflow-x:auto;
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    min-width:590px;
    border-collapse:collapse;
    table-layout:auto;
}

th,
td{
    border-bottom:1px solid #e5e5e5;
    padding:6px 5px;
    text-align:left;
    vertical-align:middle;
    white-space:nowrap;
}

thead tr:first-child th{
    background:#176b3a;
    color:white;
    font-size:10px;
    font-weight:bold;
    text-align:center;
}

thead tr.filter-row th{
    background:#f7f7f7;
    padding:4px;
    position:sticky;
    top:0;
    z-index:5;
}

tbody td{
    font-size:15px;
    text-align:center !important;
}

tbody tr:last-child td{
    border-bottom:none;
}

tbody tr:hover{
    background:#f7faf8;
}

/* =====================================================
   LEBAR KOLOM
===================================================== */

.col-tahun{
    width:60px;
    text-align:center !important;
}

.col-sortimen{
    width:70px;
    text-align:center !important;
}

.col-mutu{
    width:60px;
    text-align:center !important;
}

.col-ukuran{
    width:35px;
    text-align:center !important;
}

.col-batang{
    width:75px;
    text-align:center !important;
}

.col-volume{
    width:85px;
    text-align:center !important;
}

/* =====================================================
   FILTER
===================================================== */

select,
input{
    width:100%;
    height:27px;
    border:1px solid #ccc;
    border-radius:4px;
    background:white;
    padding:3px 5px;
    font-family:Arial,sans-serif;
    font-size:10px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#176b3a;
}

/* =====================================================
   FILTER UKURAN
===================================================== */

#filterUkuran{
    width:100%;
    min-height:27px;
    height:27px;
    resize:none;
    overflow:hidden;
    border:1px solid #ccc;
    border-radius:4px;
    background:white;
    padding:3px 5px;
    font-family:Arial,sans-serif;
    font-size:10px;
    line-height:19px;
    outline:none;
    display:block;
}

#filterUkuran:focus{
    border-color:#176b3a;
}

/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading{
    text-align:center;
    padding:20px 10px;
    color:#777;
    font-size:11px;
}

.empty{
    text-align:center;
    padding:22px 10px;
    color:#888;
    font-size:11px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{
        font-size:12px;
    }

    .container{
        padding:6px;
        max-width:100%;
    }

    .header{
        padding:10px 11px;
        border-radius:6px;
    }

    .header h1{
        font-size:17px;
    }

    .header p{
        font-size:10px;
    }

    .status{
        padding:6px 8px;
        margin-bottom:6px;
        font-size:10px;
    }

    .summary{
        gap:5px;
        margin-bottom:6px;
    }

    .card{
        padding:6px 8px;
        border-radius:6px;
    }

    .card-label{
        font-size:9px;
    }

    .card-value{
        font-size:15px;
    }

    table{
        min-width:560px;
    }

    th,
    td{
        padding:5px 4px;
    }

    thead tr:first-child th{
        font-size:9px;
    }

    tbody td{
        font-size:15px;
    }

    select,
    input{
        height:25px;
        font-size:9px;
        padding:2px 4px;
    }

    #filterUkuran{
        min-height:25px;
        height:25px;
        font-size:9px;
        line-height:19px;
        padding:2px 4px;
    }

    .col-tahun{
        width:50px;
    }

    .col-sortimen{
        width:95px;
    }

    .col-mutu{
        width:50px;
    }

    .col-ukuran{
        width:145px;
    }

    .col-batang{
        width:65px;
    }

    .col-volume{
        width:80px;
    }
}

/* =====================================================
   VERY SMALL HP
===================================================== */

@media(max-width:380px){

    .container{
        padding:4px;
    }

    .header h1{
        font-size:16px;
    }

    table{
        min-width:520px;
    }

    .col-tahun{
        width:45px;
    }

    .col-sortimen{
        width:85px;
    }

    .col-mutu{
        width:45px;
    }

    .col-ukuran{
        width:135px;
    }

    .col-batang{
        width:60px;
    }

    .col-volume{
        width:75px;
    }
}
</style>

</head>

<body>

<div class="container">


<!-- =================================================
     HEADER
================================================== -->

<div class="header">

    <img
        src="https://raw.githubusercontent.com/ariefprastyo102-tech/scan-kayu/main/logo-perhutani.jpg"
        class="header-logo"
        alt="Logo Perhutani"
    >

    <div class="header-text">

        <h1>PERSEDIAAN RST</h1>

        <p>Persediaan RST yang masih tersedia</p>

    </div>

</div>

<!-- =================================================
     STATUS
================================================== -->

<div
    id="status"
    class="status">

    MEMUAT DATA...

</div>


<!-- =================================================
     RINGKASAN
================================================== -->

<div
    id="summary"
    class="summary">

    <div class="card">

        <div class="card-label">
            TOTAL BATANG
        </div>

        <div
            id="totalBatang"
            class="card-value">

            0

        </div>

    </div>


    <div class="card">

        <div class="card-label">
            TOTAL VOLUME
        </div>

        <div
            id="totalVolume"
            class="card-value">

            0.000000

        </div>

    </div>

</div>


<!-- =================================================
     TABEL
================================================== -->

<div class="table-wrap">

    <table>

        <colgroup>

            <col class="col-tahun">
            <col class="col-sortimen">
            <col class="col-mutu">
            <col class="col-ukuran">
            <col class="col-batang">
            <col class="col-volume">

        </colgroup>


        <thead>

            <!-- JUDUL KOLOM -->

            <tr>

                <th>TAHUN</th>
                <th>SORTIMEN</th>
                <th>MUTU</th>
                <th>UKURAN</th>
                <th>BATANG</th>
                <th>VOLUME</th>

            </tr>


            <!-- FILTER -->

            <tr class="filter-row">

                <th>

                    <select id="filterTahun">

                        <option value="SEMUA">
                            SEMUA
                        </option>

                        <option value="2025">
                            2025
                        </option>

                        <option value="2026">
                            2026
                        </option>

                    </select>

                </th>


                <th>

                    <select id="filterSortimen">

                        <option value="SEMUA">
                            SEMUA
                        </option>

                    </select>

                </th>


                <th>

                    <select id="filterMutu">

                        <option value="SEMUA">
                            SEMUA
                        </option>

                    </select>

                </th>


                <th>

                    <textarea
                        id="filterUkuran"
                        rows="1"
                        placeholder="18 100 550"></textarea>

                </th>


                <th></th>

                <th></th>

            </tr>

        </thead>


        <tbody id="tbody">

            <tr>

                <td
                    colspan="6"
                    class="loading">

                    MEMUAT DATA...

                </td>

            </tr>

        </tbody>

    </table>

</div>


</div>

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby9dcBegLV7frA3KRFNW3cvM7dwbeBI91smsnFmX8KijjpuTk15KRo4XDsAvNYAFpU2/exec";


/* =====================================================
   ELEMENT
===================================================== */

const statusBox =
    document.getElementById("status");

const tbody =
    document.getElementById("tbody");

const summary =
    document.getElementById("summary");

const totalBatang =
    document.getElementById("totalBatang");

const totalVolume =
    document.getElementById("totalVolume");

const filterTahun =
    document.getElementById("filterTahun");

const filterSortimen =
    document.getElementById("filterSortimen");

const filterMutu =
    document.getElementById("filterMutu");

const filterUkuran =
    document.getElementById("filterUkuran");


/* =====================================================
   DATA
===================================================== */

let timerUkuran = null;


/* =====================================================
   AUTO RESIZE UKURAN
===================================================== */

filterUkuran.addEventListener(
    "input",
    function(){

        this.style.height =
            "27px";

        this.style.height =
            this.scrollHeight + "px";

    }
);


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatBatang(value){

    return Number(value || 0)
        .toLocaleString("id-ID");

}


function formatVolume(value){

    return Number(value || 0)
        .toLocaleString(
            "id-ID",
            {
                minimumFractionDigits:6,
                maximumFractionDigits:6
            }
        );

}


/* =====================================================
   JSONP
===================================================== */

function jsonp(url){

    return new Promise(function(resolve,reject){

        const callbackName =
            "jsonp_" +
            Date.now() +
            "_" +
            Math.floor(Math.random()*100000);


        const script =
            document.createElement("script");

        let selesai = false;


        window[callbackName] =
            function(data){

                selesai = true;

                delete window[callbackName];

                script.remove();

                resolve(data);

            };


        script.onerror =
            function(){

                if(selesai) return;

                delete window[callbackName];

                script.remove();

                reject(
                    new Error(
                        "Gagal mengambil data dari Apps Script."
                    )
                );

            };


        script.src =
            url +
            (url.includes("?") ? "&" : "?") +
            "callback=" +
            encodeURIComponent(callbackName) +
            "&_=" +
            Date.now();


        document.body.appendChild(script);


        setTimeout(function(){

            if(selesai) return;

            selesai = true;

            delete window[callbackName];

            script.remove();

            reject(
                new Error(
                    "Waktu mengambil data habis."
                )
            );

        },20000);

    });

}


/* =====================================================
   AMBIL FILTER
===================================================== */

async function loadFilters(){

    try{

        const url =
            API_URL +
            "?action=filter";


        const hasil =
            await jsonp(url);


        if(!hasil || !hasil.sukses){

            throw new Error(
                hasil && hasil.error
                    ? hasil.error
                    : "Filter gagal."
            );

        }


        /* SORTIMEN */

        filterSortimen.innerHTML =
            '<option value="SEMUA">SEMUA</option>';


        (hasil.sortimen || [])
            .forEach(function(item){

                const option =
                    document.createElement("option");

                option.value = item;
                option.textContent = item;

                filterSortimen.appendChild(option);

            });


  /* MUTU */

filterMutu.innerHTML =
    '<option value="SEMUA">SEMUA</option>';


const urutanMutu = [
    "P",
    "D",
    "T"
];


(hasil.mutu || [])
    .sort(function(a,b){

        const posisiA =
            urutanMutu.indexOf(
                String(a).toUpperCase()
            );

        const posisiB =
            urutanMutu.indexOf(
                String(b).toUpperCase()
            );

        const nilaiA =
            posisiA === -1
                ? 999
                : posisiA;

        const nilaiB =
            posisiB === -1
                ? 999
                : posisiB;

        return nilaiA - nilaiB;

    })
    .forEach(function(item){

        const option =
            document.createElement("option");

        option.value = item;
        option.textContent = item;

        filterMutu.appendChild(option);

    });
    }

    catch(error){

        console.error(error);

        statusBox.textContent =
            "FILTER GAGAL: " +
            error.message;

    }

}


/* =====================================================
   NORMALISASI PENCARIAN UKURAN
===================================================== */

function normalisasiUkuran(text){

    return String(text || "")
        .toUpperCase()
        .split(/\n+/)
        .map(function(baris){

            return baris
                .replace(/×/g," ")
                .replace(/X/g," ")
                .replace(/,/g," ")
                .replace(/;/g," ")
                .replace(/\s+/g," ")
                .trim();

        })
        .filter(function(baris){
            return baris !== "";
        })
        .join("|");

}


/* =====================================================
   AMBIL DATA
===================================================== */

async function loadData(){

    try{

        statusBox.textContent =
            "MEMUAT DATA...";


        tbody.innerHTML =
            '<tr>' +
            '<td colspan="6" class="loading">' +
            'MEMUAT DATA...' +
            '</td>' +
            '</tr>';


        const tahun =
            encodeURIComponent(
                filterTahun.value
            );


        const sortimen =
            encodeURIComponent(
                filterSortimen.value
            );


        const mutu =
            encodeURIComponent(
                filterMutu.value
            );


        /*
         * UKURAN dikirim sebagai satu pencarian.
         * Contoh:
         * 18 100 550
         */

        const ukuran =
            encodeURIComponent(
                normalisasiUkuran(
                    filterUkuran.value
                )
            );


        const url =
            API_URL +
            "?action=data" +
            "&tahun=" + tahun +
            "&sortimen=" + sortimen +
            "&mutu=" + mutu +
            "&ukuran=" + ukuran;


        const hasil =
            await jsonp(url);


        if(!hasil || !hasil.sukses){

            throw new Error(
                hasil && hasil.error
                    ? hasil.error
                    : "Data gagal diambil."
            );

        }


        tampilkanData(
            hasil.data || []
        );


        statusBox.textContent =
    "UPDATE S/D " +
    (
        hasil.tanggalUpdate ||
        "-"
    );

    }

    catch(error){

        console.error(error);

        tbody.innerHTML =
            '<tr>' +
            '<td colspan="6" class="empty">' +
            'GAGAL MENGAMBIL DATA<br>' +
            error.message +
            '</td>' +
            '</tr>';


        totalBatang.textContent =
            "0";


        totalVolume.textContent =
            "0,000000";


        summary.style.display =
            "none";


        statusBox.textContent =
            "ERROR: " +
            error.message;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(data){

    tbody.innerHTML = "";


    let jumlahBatang = 0;

    let jumlahVolume = 0;


    if(!data.length){

        tbody.innerHTML =
            '<tr>' +
            '<td colspan="6" class="empty">' +
            'DATA TIDAK DITEMUKAN' +
            '</td>' +
            '</tr>';


        totalBatang.textContent =
            "0";


        totalVolume.textContent =
            "0,000000";


        summary.style.display =
            "none";


        return;

    }


    /*
     * TOTAL HANYA MUNCUL JIKA
     * HASIL YANG DITAMPILKAN LEBIH DARI 1
     */

    if(data.length > 1){

        summary.style.display =
            "grid";

    }else{

        summary.style.display =
            "none";

    }
const urutanSortimen = [
    "DECKING",
    "FLOORING",
    "LONGSTRIP",
    "PB PANJANG",
    "PB PENDEK",
    "P STOCK",
    "FJL",
    "RENG",
    "LIST",
    "HOUSING COMPONENT"
];


const urutanMutu = [
    "P",
    "D",
    "T"
];


data.sort(function(a, b){

    const posisiSortimenA =
        urutanSortimen.indexOf(
            String(a.sortimen || "").toUpperCase()
        );

    const posisiSortimenB =
        urutanSortimen.indexOf(
            String(b.sortimen || "").toUpperCase()
        );


    const nilaiSortimenA =
        posisiSortimenA === -1
            ? 999
            : posisiSortimenA;


    const nilaiSortimenB =
        posisiSortimenB === -1
            ? 999
            : posisiSortimenB;


    /*
     * SORTIMEN DULU
     */

    if(nilaiSortimenA !== nilaiSortimenB){

        return nilaiSortimenA - nilaiSortimenB;

    }


    /*
     * JIKA SORTIMEN SAMA,
     * BARU MUTU
     */

    const posisiMutuA =
        urutanMutu.indexOf(
            String(a.mutu || "").toUpperCase()
        );


    const posisiMutuB =
        urutanMutu.indexOf(
            String(b.mutu || "").toUpperCase()
        );


    const nilaiMutuA =
        posisiMutuA === -1
            ? 999
            : posisiMutuA;


    const nilaiMutuB =
        posisiMutuB === -1
            ? 999
            : posisiMutuB;


    return nilaiMutuA - nilaiMutuB;

});
    data.forEach(function(item){

        jumlahBatang +=
            Number(item.batang || 0);


        jumlahVolume +=
            Number(item.volume || 0);


        const tr =
            document.createElement("tr");


        tr.innerHTML =

            "<td style='text-align:center;'>" +
            escapeHTML(item.tahun) +
            "</td>" +

            "<td>" +
            escapeHTML(item.sortimen) +
            "</td>" +

            "<td style='text-align:center;'>" +
            escapeHTML(item.mutu) +
            "</td>" +

            "<td>" +
            escapeHTML(item.ukuran) +
            "</td>" +

            "<td style='text-align:right;'>" +
            formatBatang(item.batang) +
            "</td>" +

            "<td style='text-align:right;'>" +
            formatVolume(item.volume) +
            "</td>";


        tbody.appendChild(tr);

    });


    totalBatang.textContent =
        formatBatang(jumlahBatang);


    totalVolume.textContent =
        formatVolume(jumlahVolume);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   EVENT FILTER
===================================================== */

filterTahun.addEventListener(
    "change",
    function(){

        loadData();

    }
);


filterSortimen.addEventListener(
    "change",
    function(){

        loadData();

    }
);


filterMutu.addEventListener(
    "change",
    function(){

        loadData();

    }
);


filterUkuran.addEventListener(
    "input",
    function(){

        clearTimeout(timerUkuran);


        timerUkuran =
            setTimeout(
                function(){

                    loadData();

                },
                300
            );

    }
);


/* =====================================================
   START
===================================================== */

async function mulai(){

    try{

        await loadFilters();

        await loadData();

    }

    catch(error){

        console.error(error);

        statusBox.textContent =
            "GAGAL MEMUAT APLIKASI";

    }

}


mulai();

</script>

</body>
</html>
