<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MUTASI RST IK SARADAN</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f2;
    color:#1f2937;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:#166534;
    color:white;
    padding:20px 15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:23px;
    font-weight:800;
    letter-spacing:.5px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
    opacity:.9;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1400px;
    margin:auto;
    padding:15px;
}


/* =====================================================
   KONTROL
===================================================== */

.kontrol{
    background:white;
    padding:16px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(22,101,52,.10);
    margin-bottom:15px;
    border:1px solid #dce9df;
}

.kontrol label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#166534;
}

.kontrol select{
    width:100%;
    max-width:280px;
    padding:11px 12px;
    border:1px solid #a7c7af;
    border-radius:8px;
    font-size:15px;
    background:white;
    color:#1f2937;
    outline:none;
}

.kontrol select:focus{
    border-color:#16a34a;
    box-shadow:0 0 0 3px rgba(22,163,74,.12);
}


/* =====================================================
   BUTTON
===================================================== */

button{
    margin-top:10px;
    padding:11px 20px;
    border:0;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
    box-shadow:0 2px 5px rgba(22,101,52,.20);
}

button:hover{
    background:#15803d;
}

button:active{
    transform:translateY(1px);
}


/* =====================================================
   STATUS
===================================================== */

.status{
    margin-top:10px;
    font-size:13px;
    font-weight:bold;
    color:#166534;
}


/* =====================================================
   KARTU
===================================================== */

.kartu{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(22,101,52,.09);
    border:1px solid #dce9df;
}

.kartu h2{
    margin:0 0 12px;
    font-size:18px;
    color:#166534;
    border-left:5px solid #16a34a;
    padding-left:10px;
}


/* =====================================================
   TABEL
===================================================== */

.tabel-wrap{
    width:100%;
    overflow-x:auto;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
    background:white;
}

th,
td{
    border:1px solid #d7e3da;
    padding:9px 8px;
    font-size:13px;
}

th{
    background:#dcfce7;
    color:#14532d;
    font-weight:bold;
    text-align:center;
    white-space:nowrap;
}

td{
    text-align:center;
    color:#111827;
}

td:first-child{
    text-align:center;
    font-weight:bold;
    color:#166534;
}


/* =====================================================
   HEADER KELOMPOK MUTASI
===================================================== */

table thead tr:first-child th{
    background:#166534;
    color:white;
    border-color:#14532d;
}

table thead tr:nth-child(2) th{
    background:#dcfce7;
    color:#14532d;
}


/* =====================================================
   TOTAL
===================================================== */

.total{
    font-weight:bold;
    background:#ecfdf5;
    color:#14532d;
}

.total td{
    border-top:2px solid #16a34a;
}


/* =====================================================
   HOVER BARIS
===================================================== */

tbody tr:hover:not(.total){
    background:#f0fdf4;
}


/* =====================================================
   KOSONG / LOADING
===================================================== */

.kosong{
    padding:22px;
    text-align:center;
    color:#6b7280;
}

.loading{
    padding:18px;
    text-align:center;
    color:#6b7280;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .container{
        padding:8px;
    }

    .header{
        padding:17px 10px;
    }

    .header h1{
        font-size:20px;
    }

    .header p{
        font-size:12px;
    }

    .kontrol{
        padding:12px;
        border-radius:10px;
    }

    .kontrol select{
        max-width:none;
    }

    button{
        width:100%;
        padding:12px;
    }

    .kartu{
        padding:10px;
        border-radius:10px;
    }

    .kartu h2{
        font-size:16px;
        margin-bottom:10px;
    }

    th,
    td{
        padding:8px 7px;
        font-size:12px;
    }

}
/* =====================================================
   FILTER + RINGKASAN
===================================================== */

.kontrol{
    display:flex;
    gap:20px;
    align-items:stretch;
}

.filter-bulan{
    width:280px;
    flex-shrink:0;
}

.ringkasan{
    flex:1;
    overflow-x:auto;
    width:100%;
}

.tabel-ringkasan{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

.tabel-ringkasan th{
    background:#166534;
    color:white;
    text-align:center;
    padding:9px 8px;
    border:1px solid #14532d;
    font-size:12px;
}

.tabel-ringkasan td{
    background:#f0fdf4;
    color:#111827;
    text-align:center;
    padding:10px 8px;
    border:1px solid #bbf7d0;
    font-size:13px;
}

/* GARIS TEGAS SETELAH KOLOM VOLUME */
.tabel-ringkasan th:nth-child(2),
.tabel-ringkasan td:nth-child(2),
.tabel-ringkasan th:nth-child(4),
.tabel-ringkasan td:nth-child(4),
.tabel-ringkasan th:nth-child(6),
.tabel-ringkasan td:nth-child(6){
    border-right:3px solid #166534;
}
/* GARIS TEGAS PINGGIR KIRI DAN KANAN */
.tabel-ringkasan th:first-child,
.tabel-ringkasan td:first-child{
    border-left:3px solid #166534;
}

.tabel-ringkasan th:last-child,
.tabel-ringkasan td:last-child{
    border-right:3px solid #166534;
}
.tabel-ringkasan td b{
    font-size:14px;
    font-weight:600;
}

.tabel-ringkasan td span{
    font-size:14px;
    font-weight:600;
    color:#111827;
}

@media(max-width:700px){

    .kontrol{
        display:block;
    }

    .filter-bulan{
        width:100%;
    }

    .ringkasan{
        margin-top:15px;
    }

}
</style>

</head>


<body>

    <h1>MUTASI RST IK SARADAN</h1>

<div class="container">

            <th>BATANG</th>

            <th>VOLUME</th>

            <th>BATANG</th>
            <th>VOLUME</th>

    </thead>

    <tbody>

            <td>

</table>
</div>

<script>


/* =====================================================
   BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbypJNYC6-NBlrCsNyyHEArB6UcgyZNUQ8IQTXF7AO716jxlatYe0V0b6oyctjBrhIo/exec";



/* =====================================================
   BULAN
===================================================== */

const namaBulan = [

    "",

    "JANUARI",

    "FEBRUARI",

    "MARET",

    "APRIL",

    "MEI",

    "JUNI",

    "JULI",

    "AGUSTUS",

    "SEPTEMBER",

    "OKTOBER",

    "NOVEMBER",

    "DESEMBER"

];



/* =====================================================
   FORMAT BATANG
===================================================== */

function formatBatang(angka){

    return Number(
        angka || 0
    ).toLocaleString(
        "id-ID",
        {
            maximumFractionDigits:0
        }
    );

}



/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(angka){

    return Number(
        angka || 0
    ).toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:6,
            maximumFractionDigits:6
        }
    ) + " m³";

}



/* =====================================================
   FORMAT TANGGAL
   AMAN UNTUK:
   DD-MM-YYYY
   YYYY-MM-DD
   DATE
===================================================== */

function formatTanggal(tanggal){

    if(!tanggal){

        return "";

    }


    /* =================================================
       KALAU SUDAH STRING DD-MM-YYYY
    ================================================= */

    if(
        typeof tanggal === "string"
    ){

        const text =
            tanggal.trim();


        const cocok =
            text.match(
                /^(\d{1,2})-(\d{1,2})-(\d{4})$/
            );


        if(cocok){

            const hari =
                String(
                    cocok[1]
                ).padStart(
                    2,
                    "0"
                );

            const bulan =
                String(
                    cocok[2]
                ).padStart(
                    2,
                    "0"
                );

            const tahun =
                cocok[3];


            return (
                hari +
                "-" +
                bulan +
                "-" +
                tahun
            );

        }


        const iso =
            text.match(
                /^(\d{4})-(\d{1,2})-(\d{1,2})/
            );


        if(iso){

            const tahun =
                iso[1];

            const bulan =
                String(
                    iso[2]
                ).padStart(
                    2,
                    "0"
                );

            const hari =
                String(
                    iso[3]
                ).padStart(
                    2,
                    "0"
                );


            return (
                hari +
                "-" +
                bulan +
                "-" +
                tahun
            );

        }

    }


    /* =================================================
       KALAU DATE OBJECT / FORMAT LAIN
    ================================================= */

    const d =
        new Date(
            tanggal
        );


    if(
        isNaN(
            d.getTime()
        )
    ){

        return String(
            tanggal
        );

    }


    const hari =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    const bulan =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const tahun =
        d.getFullYear();


    return (
        hari +
        "-" +
        bulan +
        "-" +
        tahun
    );

}



/* =====================================================
   JSONP
===================================================== */

function panggilAPI(
    action,
    bulan,
    callback
){

    const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 10000
        );


    window[callbackName] =
        function(response){

            try{

                callback(
                    response
                );

            }
            finally{

                delete window[
                    callbackName
                ];

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API_URL +
        "?action=" +
        encodeURIComponent(
            action
        ) +
        "&bulan=" +
        encodeURIComponent(
            bulan
        ) +
        "&callback=" +
        encodeURIComponent(
            callbackName
        ) +
        "&_=" +
        Date.now();


    script.onerror =
        function(){

            delete window[
                callbackName
            ];

            callback({

                status:"error",

                message:
                    "Gagal menghubungi Apps Script."

            });

        };


    document.body.appendChild(
        script
    );

}

function muatDataTerakhir(){

    panggilAPI(
        "dataterakhir",
        "",
        function(response){

            if(
                !response ||
                response.status !==
                "success"
            ){

                return;

            }


            const data =
                response.dataTerakhir ||
                {};


            document.getElementById(
                "ringkasAwalBatang"
            ).innerText =
                formatBatang(
                    data.awalBatang
                );


            document.getElementById(
                "ringkasAwalVolume"
            ).innerText =
                formatVolume(
                    data.awalVolume
                );


            document.getElementById(
                "ringkasProduksiBatang"
            ).innerText =
                formatBatang(
                    data.produksiBatang
                );


            document.getElementById(
                "ringkasProduksiVolume"
            ).innerText =
                formatVolume(
                    data.produksiVolume
                );


            document.getElementById(
                "ringkasTerjualBatang"
            ).innerText =
                formatBatang(
                    data.terjualBatang
                );


            document.getElementById(
                "ringkasTerjualVolume"
            ).innerText =
                formatVolume(
                    data.terjualVolume
                );


            document.getElementById(
                "ringkasAkhirBatang"
            ).innerText =
                formatBatang(
                    data.akhirBatang
                );


            document.getElementById(
                "ringkasAkhirVolume"
            ).innerText =
                formatVolume(
                    data.akhirVolume
                );

        }
    );

}
      
/* =====================================================
   TAMPILKAN BULAN
===================================================== */

function tampilkanBulan(
    bulan,
    data
){

    document.getElementById(
        "judulMutasi"
    ).innerText =
        "MUTASI " +
        namaBulan[
            Number(bulan)
        ];


    tampilkanMutasi(
        data.mutasi || []
    );


    tampilkanRincian(
        data.rincian || []
    );

}


/* =====================================================
   MUAT MUTASI
   SUMBER DATA:
   APPS SCRIPT → MUTASI_RST_CACHE_V2
===================================================== */

function muatMutasi(){
         
    const bulan =
        Number(
            document.getElementById(
                "bulan"
            ).value
        );


    const status =
        document.getElementById(
            "status"
        );


    const boxMutasi =
        document.getElementById(
            "mutasi"
        );


    const boxRincian =
        document.getElementById(
            "rincian"
        );


    document.getElementById(
        "judulMutasi"
    ).innerText =
        "MUTASI " +
        namaBulan[bulan];


    status.innerText =
        "⏳ MEMUAT DATA " +
        namaBulan[bulan] +
        "...";


    boxMutasi.innerHTML =
        "⏳ Sedang mengambil mutasi...";


    boxRincian.innerHTML =
        "⏳ Sedang mengambil rincian...";


    /* =================================================
       AMBIL MUTASI + RINCIAN DARI APPS SCRIPT
    ================================================= */

    panggilAPI(
        "mutasirincian",
        bulan,
        function(response){

            if(
                !response ||
                response.status !==
                "success"
            ){

                boxMutasi.innerHTML =
                    "<div class='kosong'>" +
                    (
                        response &&
                        response.message
                            ? response.message
                            : "Gagal mengambil data."
                    ) +
                    "</div>";


                boxRincian.innerHTML =
                    "<div class='kosong'>" +
                    "Gagal mengambil rincian." +
                    "</div>";


                status.innerText =
                    "❌ GAGAL";

                return;

            }

            /* =========================================
               TAMPILKAN MUTASI
            ========================================= */

            tampilkanMutasi(
                response.data || []
            );


            /* =========================================
               TAMPILKAN RINCIAN TERJUAL
            ========================================= */

            tampilkanRincian(
                response.rincian || []
            );

            status.innerText =
                "✅ DATA " +
                namaBulan[bulan] +
                " DIMUAT";

        }
    );

}
/* =====================================================
   TAMPILKAN MUTASI
===================================================== */

function tampilkanMutasi(
    data
){

    const box =
        document.getElementById(
            "mutasi"
        );


    if(
        !Array.isArray(data) ||
        !data.length
    ){

        box.innerHTML =
            "<div class='kosong'>" +
            "Tidak ada data." +
            "</div>";

        return;

    }


    let totalAwalBatang = 0;

    let totalAwalVolume = 0;


    let totalProduksiBatang = 0;

    let totalProduksiVolume = 0;


    let totalTerjualBatang = 0;

    let totalTerjualVolume = 0;


    let totalAkhirBatang = 0;

    let totalAkhirVolume = 0;



    let html = `

    <div class="tabel-wrap">

    <table>

        <thead>

            <tr>

                <th rowspan="2">
                    SORTIMEN
                </th>

                <th colspan="2">
                    SISA AWAL
                </th>

                <th colspan="2">
                    PRODUKSI
                </th>

                <th colspan="2">
                    TERJUAL/OPER
                </th>

                <th colspan="2">
                    SISA AKHIR
                </th>

            </tr>


            <tr>

                <th>BATANG</th>

                <th>VOLUME</th>


                <th>BATANG</th>

                <th>VOLUME</th>


                <th>BATANG</th>

                <th>VOLUME</th>


                <th>BATANG</th>

                <th>VOLUME</th>

            </tr>

        </thead>


        <tbody>

    `;

const urutanSortimen = [
    "DECKING",
    "FLOORING",
    "LONGSTRIP",
    "PB PANJANG",
    "PB PENDEK",
    "P STOCK",
    "FJL",
    "RENG",
    "LIST",
    "HOUSING COMPONENT",
    "HOUSING COMPONENT GRAHADI",
    "HOUSING COMPONENT HALL",
    "HOUSING COMPONENT PAVILLIUN",
    "BLOCKWARE"
];

data.sort(
    function(a, b){

        const namaA =
            String(
                a.sortimen || ""
            )
            .trim()
            .toUpperCase();


        const namaB =
            String(
                b.sortimen || ""
            )
            .trim()
            .toUpperCase();


        let ia =
            urutanSortimen.indexOf(
                namaA
            );


        let ib =
            urutanSortimen.indexOf(
                namaB
            );


        if(ia === -1){
            ia = 999;
        }


        if(ib === -1){
            ib = 999;
        }


        return ia - ib;

    }
);

    data.forEach(
        function(item){

            const awalBatang =
                Number(
                    item.awalBatang || 0
                );


            const awalVolume =
                Number(
                    item.awalVolume || 0
                );


            const produksiBatang =
                Number(
                    item.produksiBatang || 0
                );


            const produksiVolume =
                Number(
                    item.produksiVolume || 0
                );


            const terjualBatang =
                Number(
                    item.terjualBatang || 0
                );


            const terjualVolume =
                Number(
                    item.terjualVolume || 0
                );


            const akhirBatang =
                Number(
                    item.akhirBatang || 0
                );


            const akhirVolume =
                Number(
                    item.akhirVolume || 0
                );
              if(
    awalBatang === 0 &&
    awalVolume === 0 &&
    produksiBatang === 0 &&
    produksiVolume === 0 &&
    terjualBatang === 0 &&
    terjualVolume === 0 &&
    akhirBatang === 0 &&
    akhirVolume === 0
){
    return;
}

            totalAwalBatang +=
                awalBatang;


            totalAwalVolume +=
                awalVolume;


            totalProduksiBatang +=
                produksiBatang;


            totalProduksiVolume +=
                produksiVolume;


            totalTerjualBatang +=
                terjualBatang;


            totalTerjualVolume +=
                terjualVolume;


            totalAkhirBatang +=
                akhirBatang;


            totalAkhirVolume +=
                akhirVolume;



            html += `

            <tr>

                <td>
                    ${escapeHTML(
                        item.sortimen || ""
                    )}
                </td>


                <td>
                    ${formatBatang(
                        awalBatang
                    )}
                </td>


                <td>
                    ${formatVolume(
                        awalVolume
                    )}
                </td>


                <td>
                    ${formatBatang(
                        produksiBatang
                    )}
                </td>


                <td>
                    ${formatVolume(
                        produksiVolume
                    )}
                </td>


                <td>
                    ${formatBatang(
                        terjualBatang
                    )}
                </td>


                <td>
                    ${formatVolume(
                        terjualVolume
                    )}
                </td>


                <td>

/* =====================================================
   RINCIAN TERJUAL
   GROUP:
   TANGGAL + SORTIMEN + PEMBELI

   JADI:
   09-02-2026 | FLOORING | CV EXCELCON
   YANG SAMA DIGABUNG MENJADI 1 BARIS
===================================================== */

function tampilkanRincian(
    data
){

    const box =
        document.getElementById(
            "rincian"
        );


    if(
        !Array.isArray(data) ||
        !data.length
    ){

        box.innerHTML =
            "<div class='kosong'>" +
            "Belum ada penjualan pada bulan ini." +
            "</div>";

        return;

    }



    /* =================================================
       GROUP DATA
    ================================================= */

    const group = {};



    data.forEach(
        function(item){

            const tanggal =
                formatTanggal(
                    item.tanggal
                );


            const sortimen =
                String(
                    item.sortimen || ""
                ).trim();


            const pembeli =
                String(
                    item.pembeli || ""
                ).trim();



            /* -----------------------------------------
               KEY GROUP
            ----------------------------------------- */

            const key =
                tanggal +
                "|" +
                sortimen +
                "|" +
                pembeli;



            if(!group[key]){

                group[key] = {

                    tanggal:
                        tanggal,

                    sortimen:
                        sortimen,

                    pembeli:
                        pembeli,

                    batang:0,

                    volume:0

                };

            }



            group[key].batang +=
                Number(
                    item.batang || 0
                );


            group[key].volume +=
                Number(
                    item.volume || 0
                );

        }
    );



    /* =================================================
       UBAH OBJECT MENJADI ARRAY
    ================================================= */

    const hasil =
        Object.values(
            group
        );



    /* =================================================
       URUTKAN TANGGAL
    ================================================= */

    hasil.sort(
        function(a,b){

            const da =
                tanggalKeAngka(
                    a.tanggal
                );


            const db =
                tanggalKeAngka(
                    b.tanggal
                );


            return da - db;

        }
    );



    /* =================================================
       TOTAL
    ================================================= */

    let totalBatang = 0;

    let totalVolume = 0;



    let html = `

    <div class="tabel-wrap">

    <table>

        <thead>

            <tr>

                <th>
                    TANGGAL
                </th>

                <th>
                    SORTIMEN
                </th>

                <th>
                    PEMBELI/OPER
                </th>

                <th>
                    BATANG
                </th>

                <th>
                    VOLUME
                </th>

            </tr>

        </thead>


        <tbody>

    `;



    hasil.forEach(
        function(item){

            const batang =
                Number(
                    item.batang || 0
                );


            const volume =
                Number(
                    item.volume || 0
                );



            totalBatang +=
                batang;


            totalVolume +=
                volume;



            html += `

            <tr>

                <td>
                    ${escapeHTML(
                        item.tanggal
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        item.sortimen
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        item.pembeli
                    )}
                </td>


                <td>
                    ${formatBatang(
                        batang
                    )}
                </td>


                <td>
                    ${formatVolume(
                        volume
                    )}
                </td>

            </tr>

            `;

        }
    );



    /* =================================================
       TOTAL
    ================================================= */

    html += `

        <tr class="total">

            <td colspan="3">
                TOTAL
            </td>


            <td>
                ${formatBatang(
                    totalBatang
                )}
            </td>


            <td>
                ${formatVolume(
                    totalVolume
                )}
            </td>

        </tr>


        </tbody>

    </table>

    </div>

    `;



    box.innerHTML =
        html;

}



/* =====================================================
   KONVERSI TANGGAL UNTUK SORTING

   DD-MM-YYYY
   MENJADI ANGKA YYYYMMDD
===================================================== */

function tanggalKeAngka(
    tanggal
){

    const text =
        String(
            tanggal || ""
        ).trim();


    const match =
        text.match(
            /^(\d{2})-(\d{2})-(\d{4})$/
        );


    if(!match){

        return 99999999;

    }


    const hari =
        Number(
            match[1]
        );


    const bulan =
        Number(
            match[2]
        );


    const tahun =
        Number(
            match[3]
        );


    return (
        tahun * 10000 +
        bulan * 100 +
        hari
    );

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    teks
){

    return String(
        teks ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
